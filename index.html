<html lang="tr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finansal Analiz & Sinyaller</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0e14; color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #151a21; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; }
        h1 { font-size: 1rem; font-weight: 600; color: #fff; }
        
        /* Kategori Sekmeleri */
        .categories { display: flex; gap: 6px; padding: 10px 12px; background: #11151c; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #1f293d; }
        .category-btn { background: #1f293d; border: none; color: #9ca3af; padding: 6px 14px; border-radius: 16px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .category-btn.active { background: #2563eb; color: #fff; }

        /* Enstrüman Ekleme & Seçim Çubuğu */
        .symbol-bar { background: #11151c; padding: 8px 12px; border-bottom: 1px solid #1f293d; display: flex; flex-direction: column; gap: 6px; }
        .add-form { display: flex; gap: 6px; }
        .add-form input { flex: 1; background: #1a2234; border: 1px solid #2d3748; color: #fff; padding: 7px 10px; border-radius: 8px; font-size: 0.82rem; outline: none; }
        .add-form input::placeholder { color: #6b7280; }
        .add-form button { background: #2563eb; color: #fff; border: none; padding: 7px 12px; border-radius: 8px; font-weight: 600; font-size: 0.82rem; cursor: pointer; }
        
        .chip-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
        .chip-list::-webkit-scrollbar { height: 3px; }
        .chip { background: #1f293d; color: #d1d5db; border: 1px solid #2d3748; padding: 4px 10px; border-radius: 14px; font-size: 0.75rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
        .chip.active { background: #2563eb; color: #fff; border-color: #3b82f6; }
        .chip .del-btn { color: #9ca3af; font-weight: bold; font-size: 0.8rem; }

        .content { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        /* Analiz Paneli */
        .analysis-box { background: #151a21; border: 1px solid #1f293d; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .asset-info-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; padding-bottom: 8px; }
        .asset-title { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .asset-price-box { text-align: right; }
        .asset-price { font-size: 1.1rem; font-weight: 600; color: #fff; }
        .asset-change { font-size: 0.75rem; font-weight: 600; padding: 2px 5px; border-radius: 4px; display: inline-block; margin-top: 2px; }
