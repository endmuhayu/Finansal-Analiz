<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Finansal Analiz</title>
                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                    <style>
                            * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
                                    body { background-color: #0b0e14; color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
                                            
                                                    header { background: #151a21; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; }
                                                            header h1 { font-size: 1rem; font-weight: 600; color: #fff; }
                                                                    .live-badge { font-size: 0.72rem; color: #10b981; background: rgba(16,185,129,0.12); padding: 3px 8px; border-radius: 6px; }

                                                                            /* Sekmeler */
                                                                                    .tabs { display: flex; gap: 6px; padding: 10px 12px; background: #11151c; border-bottom: 1px solid #1f293d; }
                                                                                            .tab-btn { flex: 1; background: #1f293d; border: none; color: #9ca3af; padding: 8px 10px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
                                                                                                    .tab-btn.active { background: #2563eb; color: #fff; }

                                                                                                            /* Ekleme ve Seçim Çubuğu */
                                                                                                                    .symbol-bar { background: #11151c; padding: 10px 12px; border-bottom: 1px solid #1f293d; display: flex; flex-direction: column; gap: 8px; }
                                                                                                                            .add-row { display: flex; gap: 6px; }
                                                                                                                                    .add-row input { flex: 1; background: #1a2234; border: 1px solid #2d3748; color: #fff; padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; outline: none; }
                                                                                                                                            .add-row button { background: #2563eb; color: #fff; border: none; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }

                                                                                                                                                    .chip-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
                                                                                                                                                            .chip { background: #1f293d; color: #d1d5db; border: 1px solid #2d3748; padding: 5px 10px; border-radius: 14px; font-size: 0.78rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
                                                                                                                                                                    .chip.active { background: #2563eb; color: #fff; border-color: #3b82f6; }
                                                                                                                                                                            .chip .del { color: #9ca3af; font-weight: bold; padding-left: 2px; }

                                                                                                                                                                                    /* Ana İçerik */
                                                                                                                                                                                            .content { flex: 1; overflow-y: auto; padding: 12px; }
                                                                                                                                                                                                    .card { background: #151a21; border: 1px solid #1f293d; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
                                                                                                                                                                                                            
                                                                                                                                                                                                                    .price-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; padding-bottom: 10px; }
                                                                                                                                                                                                                            .sym-title { font-size: 1.2rem; font-weight: 700; color: #fff; }
                                                                                                                                                                                                                                    .sym-sub { font-size: 0.75rem; color: #9ca3af; }
                                                                                                                                                                                                                                            .price-val { font-size: 1.2rem; font-weight: 700; color: #fff; text-align: right; }
                                                                                                                                                                                                                                                    .price-chg { font-size: 0.78rem; font-weight: 600; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 2px; }
                                                                                                                                                                                                                                                            .pos { color: #10b981; background: rgba(16,185,129,0.12); }
                                                                                                                                                                                                                                                                    .neg { color: #ef4444; background: rgba(239,68,68,0.12); }

                                                                                                                                                                                                                                                                            /* Sinyal Kutusu */
                                                                                                                                                                                                                                                                                    .signal-box { display: flex; justify-content: space-between; align-items: center; background: #0b0e14; padding: 10px 12px; border-radius: 8px; border: 1px solid #1f293d; }
                                                                                                                                                                                                                                                                                            .badge { padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; }
                                                                                                                                                                                                                                                                                                    .b-strong { background: #10b981; color: #fff; }
                                                                                                                                                                                                                                                                                                            .b-buy { background: #3b82f6; color: #fff; }
                                                                                                                                                                                                                                                                                                                    .b-hold { background: #f59e0b; color: #fff; }
                                                                                                                                                                                                                                                                                                                            .b-sell { background: #ef4444; color: #fff; }

                                                                                                                                                                                                                                                                                                                                    /* İndikatörler (CMF + BB + RSI) */
                                                                                                                                                                                                                                                                                                                                            .ind-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; }
                                                                                                                                                                                                                                                                                                                                                    .ind-item { background: #0b0e14; padding: 8px 4px; border-radius: 8px; border: 1px solid #1f293d; font-size: 0.72rem; color: #9ca3af; }
                                                                                                                                                                                                                                                                                                                                                            .ind-item strong { display: block; color: #fff; font-size: 0.85rem; margin-top: 3px; }

                                                                                                                                                                                                                                                                                                                                                                    /* Alım Satım Seviyeleri */
                                                                                                                                                                                                                                                                                                                                                                            .levels-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
                                                                                                                                                                                                                                                                                                                                                                                    .lvl-item { background: #0b0e14; padding: 8px 10px; border-radius: 8px; border: 1px solid #1f293d; display: flex; justify-content: space-between; font-size: 0.8rem; }
                                                                                                                                                                                                                                                                                                                                                                                            .lvl-item span:first-child { color: #9ca3af; }
                                                                                                                                                                                                                                                                                                                                                                                                    .c-buy { color: #10b981; font-weight: 700; }
                                                                                                                                                                                                                                                                                                                                                                                                            .c-stop { color: #ef4444; font-weight: 700; }
                                                                                                                                                                                                                                                                                                                                                                                                                    .c-tgt { color: #3b82f6; font-weight: 700; }

                                                                                                                                                                                                                                                                                                                                                                                                                            .chart-box { position: relative; height: 170px; width: 100%; }
                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                    <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <h1>📊 Finansal Analiz</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span class="live-badge" id="status-text">● Aktif</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="tabs">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="tab-btn active" id="btn-doviz" onclick="setCategory('doviz')">Döviz & Altın</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button class="tab-btn" id="btn-crypto" onclick="setCategory('crypto')">Kripto</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="tab-btn" id="btn-bist" onclick="setCategory('bist')">Borsa</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="symbol-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="add-row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="new-sym" placeholder="Sembol yaz (Örn: EUR/TRY, XRP, EREGL)">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button type="button" onclick="addAsset()">Ekle</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="chip-list" id="chip-list"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="content">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="price-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="sym-title" id="ui-sym">USD/TRY</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="sym-sub" id="ui-name">Amerikan Doları</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="price-val" id="ui-price">₺34.50</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div style="text-align: right;"><span class="price-chg pos" id="ui-chg">+0.45%</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="signal-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div style="font-size: 0.7rem; color: #9ca3af;">CMF + Bollinger Kararı</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="ui-sig-desc" style="font-size: 0.82rem; font-weight: 600; margin-top: 2px;">Para Girişi Pozitif</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span class="badge b-strong" id="ui-badge">GÜÇLÜ AL</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="ind-grid">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="ind-item">Chaikin (CMF)<strong id="ui-cmf">+0.14</strong></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="ind-item">Bollinger<strong id="ui-bb">Orta Üstü</strong></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="ind-item">RSI (14)<strong id="ui-rsi">58.2</strong></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="levels-grid">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="lvl-item"><span>İdeal Alış:</span><span class="c-buy" id="lvl-buy">₺34.10</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="lvl-item"><span>Zarar Kes:</span><span class="c-stop" id="lvl-stop">₺33.50</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="lvl-item"><span>Hedef 1:</span><span class="c-tgt" id="lvl-t1">₺35.20</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="lvl-item"><span>Hedef 2:</span><span class="c-tgt" id="lvl-t2">₺36.00</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="chart-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <canvas id="myChart"></canvas>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    var store = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                doviz: [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                { sym: 'USD/TRY', name: 'Dolar / TL', price: 34.50, chg: '+0.45%', pos: true, hist: [34.1, 34.2, 34.3, 34.4, 34.5] },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                { sym: 'EUR/TRY', name: 'Euro / TL', price: 36.80, chg: '+0.60%', pos: true, hist: [36.2, 36.4, 36.5, 36.7, 36.8] },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                { sym: 'GRAM', name: 'Gram Altın', price: 2980.00, chg: '+1.10%', pos: true, hist: [2920, 2940, 2955, 2970, 2980] },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                { sym: 'ONS', name: 'Ons Altın', price: 2720.00, chg: '+0.80%', pos: true, hist: [2680, 2695, 2705, 2712, 2720] }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        crypto: [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        { sym: 'BTC', name: 'Bitcoin', id: 'bitcoin', price: 92450, chg: '+3.20%', pos: true, hist: [88000, 89500, 90200, 91500, 92450] },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        { sym: 'ETH', name: 'Ethereum', id: 'ethereum', price: 3450, chg: '+1.90%', pos: true, hist: [3300, 3350, 3390, 3420, 3450] },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        { sym: 'SOL', name: 'Solana', id: 'solana', price: 198.40, chg: '-1.25%', pos: false, hist: [205, 203, 201, 199, 198.4] },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        { sym: 'AVAX', name: 'Avalanche', id: 'avalanche-2', price: 38.20, chg: '+4.10%', pos: true, hist: [35, 36, 36.8, 37.5, 38.2] }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ],
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                bist: [
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                { sym: 'THYAO', name: 'Türk Hava Yolları', price: 314.50, chg: '+2.45%', pos: true, hist: [302, 305, 308, 310, 314.5] },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                { sym: 'ASELS', name: 'Aselsan', price: 62.10, chg: '+1.10%', pos: true, hist: [59, 60, 60.5, 61.5, 62.1] },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                { sym: 'GARAN', name: 'Garanti BBVA', price: 112.50, chg: '+1.80%', pos: true, hist: [108, 109, 110, 111, 112.5] },
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                { sym: 'TUPRS', name: 'Tüpraş', price: 154.20, chg: '-0.85%', pos: false, hist: [157, 156, 155.5, 155, 154.2] }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ]
