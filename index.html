<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Gelişmiş Finansal Analiz & Sinyaller</title>
                <!-- Chart.js Grafik Kütüphanesi -->
                    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
                        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
                            <style>
                                    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
                                            body { background-color: #0b0e14; color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
                                                    header { background: #151a21; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; }
                                                            h1 { font-size: 1.05rem; font-weight: 600; color: #fff; }
                                                                    
                                                                            /* Enstrüman Ekleme & Seçim Çubuğu */
                                                                                    .symbol-bar { background: #11151c; padding: 10px 12px; border-bottom: 1px solid #1f293d; display: flex; flex-direction: column; gap: 8px; }
                                                                                            .add-form { display: flex; gap: 6px; }
                                                                                                    .add-form input { flex: 1; background: #1a2234; border: 1px solid #2d3748; color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; }
                                                                                                            .add-form input::placeholder { color: #6b7280; }
                                                                                                                    .add-form button { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
                                                                                                                            
                                                                                                                                    .chip-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
                                                                                                                                            .chip-list::-webkit-scrollbar { height: 3px; }
                                                                                                                                                    .chip { background: #1f293d; color: #d1d5db; border: 1px solid #2d3748; padding: 5px 12px; border-radius: 16px; font-size: 0.78rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
                                                                                                                                                            .chip.active { background: #2563eb; color: #fff; border-color: #3b82f6; }
                                                                                                                                                                    .chip .del-btn { color: #9ca3af; font-weight: bold; font-size: 0.85rem; padding-left: 2px; }

                                                                                                                                                                            .content { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 75px; display: flex; flex-direction: column; gap: 14px; }
                                                                                                                                                                                    
                                                                                                                                                                                            /* Analiz Paneli */
                                                                                                                                                                                                    .analysis-box { background: #151a21; border: 1px solid #1f293d; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
                                                                                                                                                                                                            .asset-info-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; padding-bottom: 10px; }
                                                                                                                                                                                                                    .asset-title { font-size: 1.15rem; font-weight: 700; color: #fff; }
                                                                                                                                                                                                                            .asset-price-box { text-align: right; }
                                                                                                                                                                                                                                    .asset-price { font-size: 1.15rem; font-weight: 600; color: #fff; }
                                                                                                                                                                                                                                            .asset-change { font-size: 0.8rem; font-weight: 600; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 2px; }
                                                                                                                                                                                                                                                    .positive { color: #10b981; background: rgba(16, 185, 129, 0.1); }
                                                                                                                                                                                                                                                            .negative { color: #ef4444; background: rgba(239, 68, 68, 0.1); }

                                                                                                                                                                                                                                                                    /* Sinyal Rozeti ve İndikatörler */
                                                                                                                                                                                                                                                                            .signal-container { display: flex; justify-content: space-between; align-items: center; background: #0b0e14; padding: 10px 14px; border-radius: 10px; border: 1px solid #1f293d; }
                                                                                                                                                                                                                                                                                    .signal-badge { padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; }
                                                                                                                                                                                                                                                                                            .sig-strong-buy { background: #10b981; color: #fff; }
                                                                                                                                                                                                                                                                                                    .sig-buy { background: #3b82f6; color: #fff; }
                                                                                                                                                                                                                                                                                                            .sig-hold { background: #f59e0b; color: #fff; }
                                                                                                                                                                                                                                                                                                                    .sig-sell { background: #ef4444; color: #fff; }

                                                                                                                                                                                                                                                                                                                            .indicators-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 0.78rem; color: #9ca3af; text-align: center; }
                                                                                                                                                                                                                                                                                                                                    .indicator-card { background: #0b0e14; padding: 8px; border-radius: 8px; border: 1px solid #1f293d; }
                                                                                                                                                                                                                                                                                                                                            .indicator-card span { display: block; color: #fff; font-weight: 600; margin-top: 2px; }

                                                                                                                                                                                                                                                                                                                                                    /* Alım / Satım Seviyeleri Tablosu */
                                                                                                                                                                                                                                                                                                                                                            .levels-box { background: #0b0e14; border: 1px solid #1f293d; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
                                                                                                                                                                                                                                                                                                                                                                    .levels-title { font-size: 0.85rem; font-weight: 600; color: #60a5fa; margin-bottom: 2px; }
                                                                                                                                                                                                                                                                                                                                                                            .level-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 0.8rem; }
                                                                                                                                                                                                                                                                                                                                                                                    .level-item { background: #151a21; padding: 8px 10px; border-radius: 8px; border: 1px solid #1f293d; display: flex; justify-content: space-between; align-items: center; }
                                                                                                                                                                                                                                                                                                                                                                                            .level-label { color: #9ca3af; }
                                                                                                                                                                                                                                                                                                                                                                                                    .level-val { font-weight: 700; color: #fff; }
                                                                                                                                                                                                                                                                                                                                                                                                            .val-buy { color: #10b981; }
                                                                                                                                                                                                                                                                                                                                                                                                                    .val-target { color: #3b82f6; }
                                                                                                                                                                                                                                                                                                                                                                                                                            .val-stop { color: #ef4444; }

                                                                                                                                                                                                                                                                                                                                                                                                                                    .chart-container { position: relative; height: 180px; width: 100%; margin-top: 2px; }

                                                                                                                                                                                                                                                                                                                                                                                                                                            nav { position: fixed; bottom: 0; left: 0; right: 0; background: #11151c; border-top: 1px solid #1f293d; display: flex; justify-content: space-around; padding: 10px; z-index: 100; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                    .nav-item { background: none; border: none; color: #9ca3af; font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                            .nav-item.active { color: #2563eb; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .tab-content { display: none; flex-direction: column; gap: 14px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .tab-content.active { display: flex; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .guide-box { background: #151a21; border: 1px solid #1f293d; border-radius: 12px; padding: 14px; font-size: 0.85rem; line-height: 1.5; color: #d1d5db; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .guide-box h3 { color: #3b82f6; margin-bottom: 6px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h1>📊 Finansal Analiz & Sinyaller</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span style="font-size: 0.72rem; color: #10b981; background: rgba(16,185,129,0.12); padding: 4px 8px; border-radius: 6px;">● Aktif</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <!-- Enstrüman Ekleme ve Seçim Çubuğu -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="symbol-bar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="add-form" onsubmit="event.preventDefault(); addNewAsset();">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="symbol-input" placeholder="Hisse veya Kripto Ekle (Örn: GARAN, KCHOL, SOL)">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="button" onclick="addNewAsset()">+ Ekle</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="chip-list" id="chip-list"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="content">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <!-- 1. ANALİZ SEKMESİ -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="tab-analiz" class="tab-content active">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="analysis-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="asset-info-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="asset-symbol" class="asset-title">THYAO</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="asset-name" style="font-size: 0.75rem; color: #9ca3af;">Türk Hava Yolları</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="asset-price-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div id="asset-price" class="asset-price">₺314.50</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="asset-change" class="asset-change positive">+2.45%</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <!-- Otomatik Sinyal ve Göstergeler -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="signal
